<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171719">
  <meta name="description" content="Artem Marshal — авторские кольца и украшения. Откройте каталог прямо с рабочего стола.">
  <title>Artem Marshal — рабочий стол</title>
  <link rel="stylesheet" href="styles.css?v=20261014-wallpaper-video-viewer-fix">
  <link rel="icon" href="assets/brand/flower-mark.png" type="image/png">
  <script src="script.js?v=20261014-wallpaper-video-viewer-fix" defer></script>
  <script src="photo-gallery.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-finder" viewBox="0 0 64 64">
      <path d="M32 9 51 19.5v25L32 55 13 44.5v-25L32 9Z" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
      <path d="m13 19.5 19 11 19-11M32 30.5V55" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
      <path d="m25 23 7-9 7 9-7 5-7-5Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-photos" viewBox="0 0 64 64">
      <rect x="9" y="12" width="42" height="40" rx="9" fill="none" stroke="currentColor" stroke-width="2.8"/>
      <circle cx="39" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="m13 44 12-12 8 8 5-5 10 10" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 8h34a9 9 0 0 1 9 9v30" fill="none" stroke="currentColor" stroke-opacity=".43" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-notes" viewBox="0 0 64 64">
      <path d="M19 8h20l11 11v36a3 3 0 0 1-3 3H19a5 5 0 0 1-5-5V13a5 5 0 0 1 5-5Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M38 9v12h12M23 31h20M23 39h20M23 47h14" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 64 64">
      <path d="M28 13v27.8a8.5 8.5 0 1 1-5-7.7V19l25-5v21.8a8.5 8.5 0 1 1-5-7.7V13l-15 3Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-telegram" viewBox="0 0 64 64">
      <path d="m9 29 44-17-10.5 42-14.7-12.1-8.9 7.2 1.7-13.7L45 21 24 37l-15-8Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-instagram" viewBox="0 0 64 64">
      <rect x="10" y="10" width="44" height="44" rx="14" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="32" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="45" cy="19" r="2.7" fill="currentColor"/>
    </symbol>
    <symbol id="i-cart" viewBox="0 0 64 64">
      <path d="M8 13h7l6.7 29h27.6l6.1-21H19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 34h28M26 24l2.5 18M38 24l-.3 18M49 24l-2.5 18" fill="none" stroke="currentColor" stroke-opacity=".78" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="51" r="3.5" fill="none" stroke="currentColor" stroke-width="2.8"/>
      <circle cx="46" cy="51" r="3.5" fill="none" stroke="currentColor" stroke-width="2.8"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5m0-5-9 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </svg>

  <main class="desktop" id="desktop">
    <div class="wallpaper-video-wall" id="wallpaper-video-wall" aria-hidden="true">
      <div class="wallpaper-video-panel is-active"><video class="wallpaper-video" data-wallpaper-video autoplay muted playsinline webkit-playsinline preload="auto" poster="assets/background/wallpaper-1.jpg" tabindex="-1"><source src="video/background-1.mp4" type="video/mp4"></video></div>
      <div class="wallpaper-video-panel"><video class="wallpaper-video" data-wallpaper-video muted playsinline webkit-playsinline preload="none" poster="assets/background/wallpaper-2.jpg" tabindex="-1"><source src="video/background-2.mp4" type="video/mp4"></video></div>
      <div class="wallpaper-video-panel"><video class="wallpaper-video" data-wallpaper-video muted playsinline webkit-playsinline preload="none" poster="assets/background/wallpaper-3.jpg" tabindex="-1"><source src="video/background-3.mp4" type="video/mp4"></video></div>
    </div>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="wallpaper-shade" aria-hidden="true"></div>
    <div class="wallpaper-grain" aria-hidden="true"></div>
    <header class="desktop-topline">
      <a class="desktop-brand" href="#" aria-label="Artem Marshal — на рабочий стол">
        <span class="brand-copy"><strong>Artem Marshal</strong></span>
        <img class="brand-mark" src="assets/brand/flower-mark.png" alt="" aria-hidden="true">
      </a>
      <div class="desktop-status"><span class="status-light"></span><span>КАТАЛОГ</span><b>28</b></div>
      <button class="audio-toggle" id="audio-toggle" type="button" aria-label="Включить звук фоновой музыки">♫ <span>Звук выкл.</span></button>
    </header>

    <section class="desktop-icons" aria-label="Изделия текущего направления"></section>
    <div class="desktop-page-indicator" id="desktop-page-indicator" aria-hidden="true"></div>

    <p class="desktop-signature"><span>Артём Маршал</span><i aria-hidden="true"></i><span>@MARSHALJEW</span></p>

    <nav class="dock" aria-label="Приложения рабочего стола" id="dock">
      <button class="dock-app dock-app--photos" type="button" data-app="photos" aria-label="Фото — открыть галерею" aria-haspopup="dialog">
        <img src="assets/dock/photos_macos_bigsur_icon_189835.webp" alt=""><span class="dock-tip">Фото</span>
      </button>
      <button class="dock-app dock-app--notes" type="button" data-app="notes" aria-label="Заметки — об авторе" aria-haspopup="dialog">
        <img src="assets/dock/notes_macos_bigsur_icon_189901.webp" alt=""><span class="dock-tip">Заметки</span>
      </button>
      <button class="dock-app dock-app--music" type="button" data-app="music" aria-label="Авторская музыка Artem Marshal" aria-haspopup="dialog">
        <svg aria-hidden="true"><use href="#i-music"/></svg><span class="dock-tip">Музыка</span>
      </button>
      <a class="dock-app dock-app--telegram" href="https://t.me/marshaljew" target="_blank" rel="noopener noreferrer" aria-label="Канал украшений @marshaljew — Telegram">
        <svg aria-hidden="true"><use href="#i-telegram"/></svg><span class="dock-tip">Канал колец</span>
      </a>
      <a class="dock-app dock-app--instagram" href="https://www.instagram.com/coldnixen/" target="_blank" rel="noopener noreferrer" aria-label="Открыть Instagram автора">
        <img src="assets/dock/instagram_alt_macos_bigsur_icon_190065.webp" alt=""><span class="dock-tip">Instagram</span>
      </a>
      <button class="dock-app dock-app--cart" type="button" data-app="cart" aria-label="Корзина покупок. Перетащите сюда изделие, чтобы добавить его." aria-haspopup="dialog">
        <svg aria-hidden="true"><use href="#i-cart"/></svg><span class="cart-badge" id="cart-badge" aria-hidden="true" hidden>0</span><span class="sr-only" id="cart-count-text" aria-live="polite"></span><span class="dock-tip">Корзина</span>
      </button>
    </nav>

    <dialog class="app-window" id="app-window" aria-labelledby="window-title">
      <div class="window-shell">
        <header class="window-bar">
          <div class="window-controls" aria-label="Управление окном">
            <button class="traffic-light traffic-close" type="button" data-close aria-label="Закрыть окно"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
            <span class="traffic-light traffic-minimize" aria-hidden="true"></span>
            <span class="traffic-light traffic-expand" aria-hidden="true"></span>
          </div>
          <div class="window-heading"><small>ARTEM MARSHAL · WORKSPACE</small><h2 id="window-title">Коллекция</h2></div>
          <button class="window-back" type="button" data-back hidden><svg aria-hidden="true"><use href="#i-arrow"/></svg><span>Назад</span></button>
        </header>
        <div class="window-content" id="window-content"></div>
      </div>
    </dialog>
  </main>
  <dialog class="photo-viewer" id="photo-viewer" aria-labelledby="photo-viewer-title" aria-describedby="photo-viewer-counter">
    <div class="photo-viewer-shell">
      <header class="photo-viewer-bar">
        <div class="photo-viewer-heading"><small>ПРОСМОТР ФОТО</small><h2 id="photo-viewer-title"></h2></div>
        <div class="photo-viewer-tools"><span id="photo-viewer-counter" aria-live="polite"></span><button class="photo-viewer-close" type="button" data-viewer-close aria-label="Закрыть просмотр фото"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
      </header>
      <div class="photo-viewer-stage" id="photo-viewer-stage">
        <button class="photo-viewer-nav photo-viewer-nav--previous" type="button" data-viewer-step="-1" aria-label="Предыдущее фото">‹</button>
        <div class="photo-viewer-image-wrap" id="photo-viewer-image-wrap"><img id="photo-viewer-image" alt="" draggable="false"><p class="photo-viewer-error" id="photo-viewer-error" role="status" hidden>Не удалось загрузить фото. Проверьте локальный файл.</p></div>
        <button class="photo-viewer-nav photo-viewer-nav--next" type="button" data-viewer-step="1" aria-label="Следующее фото">›</button>
      </div>
      <footer class="photo-viewer-footer">
        <p>ФОТО ИЗДЕЛИЯ</p>
        <div class="photo-viewer-dots" id="photo-viewer-dots" aria-label="Выбор фото"></div>
        <div class="photo-viewer-tools-group"><span class="photo-viewer-hint">Колесо мыши · щипок</span><div class="photo-viewer-zoom-controls" role="group" aria-label="Масштаб изображения"><button type="button" data-viewer-zoom="-1" aria-label="Уменьшить фото">−</button><button type="button" data-viewer-zoom="reset" aria-label="Сбросить масштаб">100%</button><button type="button" data-viewer-zoom="1" aria-label="Увеличить фото">+</button></div></div>
      </footer>
    </div>
  </dialog>
</body>
</html>
